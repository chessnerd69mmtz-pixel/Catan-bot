name: Verify and publish Catan Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catan-bot-build
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Guard duplicate top-level function declarations
        run: node scripts/check-duplicate-functions.mjs src/main.jsx

      - name: Verify source syntax and types
        run: npx tsc --allowJs --jsx react-jsx --checkJs false --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler src/main.jsx

      - name: Run core test suite
        run: npm test

      - name: Run gameplay regression suite
        run: node tests/run-all-regressions.mjs

      - name: Run final feature audit
        run: npm run audit

      - name: Run performance benchmark
        run: npm run perf

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: catan-bot-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

      - name: Publish dist to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
